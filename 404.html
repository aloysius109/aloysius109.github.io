<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f8fb">
  <title>Page not found — Kathryn Hopkins</title>
  <link rel="icon" type="image/svg+xml" href="https://aloysius109.github.io/favicon.svg">
  <link rel="icon" href="https://aloysius109.github.io/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="https://aloysius109.github.io/apple-touch-icon.png">
  <style>
    :root { color-scheme: light; --paper: #f4f8fb; --ink: #26352e; --muted: #68756e; --green: #496b58; --pink: #a65370; --line: #dce6eb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: var(--paper); color: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
    main { width: min(720px, calc(100% - 48px)); padding-block: 72px; }
    .identity { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-size: 14px; font-weight: 700; }
    .monogram { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--green); color: white; }
    .eyebrow { margin: 72px 0 16px; color: var(--pink); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0 0 18px; font-size: clamp(42px, 8vw, 72px); font-weight: 600; line-height: 1.02; letter-spacing: -.07em; }
    p { max-width: 560px; color: var(--muted); font-size: 16px; line-height: 1.8; }
    a.return { display: inline-block; margin-top: 12px; padding: 12px 16px; border-radius: 3px; background: var(--green); color: white; font-size: 14px; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--pink); outline-offset: 4px; }
    .rule { margin-top: 70px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <a class="identity" href="/" aria-label="Kathryn Hopkins portfolio home"><span class="monogram" aria-hidden="true">K</span><span>Kathryn Hopkins</span></a>
    <p class="eyebrow">404 · Page not found</p>
    <h1>This page isn't here.</h1>
    <p>The link may be out of date, or the page may have moved. You can return to the collection and explore the published reports.</p>
    <a class="return" href="/">Browse the reports</a>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
